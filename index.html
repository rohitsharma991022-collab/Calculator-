<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simple Calculator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ---------- HTML: the structure ---------- -->
<main class="calculator">
  <div class="display" aria-live="polite">
    <div class="history" id="history"></div>
    <div class="current" id="current">0</div>
  </div>

  <div class="keys">
    <button data-action="clear">C</button>
    <button data-action="delete" aria-label="Delete last digit">&#9003;</button>
    <button class="op" data-op="/">&divide;</button>
    <button class="op" data-op="*">&times;</button>

    <button data-num="7">7</button>
    <button data-num="8">8</button>
    <button data-num="9">9</button>
    <button class="op" data-op="-">&minus;</button>

    <button data-num="4">4</button>
    <button data-num="5">5</button>
    <button data-num="6">6</button>
    <button class="op" data-op="+">+</button>

    <button data-num="1">1</button>
    <button data-num="2">2</button>
    <button data-num="3">3</button>
    <button class="equals" data-action="equals">=</button>

    <button class="zero" data-num="0">0</button>
    <button data-num=".">.</button>
  </div>
</main>

<script src="script.js"></script>
</body>
</html>
